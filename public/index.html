<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini Watermark Remover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --panel: #151820; --panel-2: #1b1f29; --text: #f2f4f8; --muted: #9aa3b5;
    --border: #262b37; --check: #1a1e27; --accent: #2563eb; --accent-hover: #1d4ed8;
    --accent-text: #8fb0ff; --beta-bg: #1c2a4d; --frame: #f5f6f8;
    --ok: #3ccb8f; --warn: #f5a524; --err: #ff6b4a;
    --shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; overflow-x: hidden; }
  main { position: relative; max-width: 1200px; margin: 0 auto; padding: 56px 16px 80px; }

  /* Ảnh trang trí hai bên */
  .deco { position: absolute; padding: 10px; background: var(--frame); border-radius: 22px;
    box-shadow: var(--shadow); pointer-events: none; }
  .deco img { display: block; border-radius: 6px; object-fit: cover; }
  .deco.left { left: 16px; top: 140px; transform: rotate(-11deg); }
  .deco.left img { width: 240px; height: 240px; }
  .deco.right { right: 16px; top: 200px; transform: rotate(16deg); }
  .deco.right img { width: 290px; height: 340px; }

  .hero { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; text-align: center; }
  @media (min-width: 900px) { h1 { white-space: nowrap; } }
  h1 { margin: 0; font-size: clamp(34px, 6vw, 60px); font-weight: 800; letter-spacing: -0.045em; line-height: 1.08; }
  .sub { margin: 20px auto 0; max-width: 640px; color: var(--muted); font-size: 18px; line-height: 1.6; }

  .tabs { display: inline-flex; gap: 4px; margin-top: 40px; padding: 4px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--border); }
  .tab { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 9px; padding: 9px 18px;
    font: inherit; font-size: 15px; font-weight: 500; color: var(--muted); background: transparent; cursor: pointer; }
  .tab svg { width: 16px; height: 16px; }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 0 0 1px var(--border); }
  .beta { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--accent-text); background: var(--beta-bg); padding: 2px 6px; border-radius: 4px; }

  .drop { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    max-width: 720px; min-height: 400px; margin: 36px auto 0; padding: 40px 24px; border-radius: 28px;
    border: 1px solid var(--border); text-align: center; cursor: pointer; transition: border-color .15s, transform .15s;
    background-color: var(--panel);
    background-image: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%);
    background-size: 28px 28px; box-shadow: var(--shadow), 0 40px 80px -40px rgba(37,99,235,.25); }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop.over { transform: scale(1.01); }
  .pick { display: inline-flex; align-items: center; gap: 12px; padding: 18px 54px; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .drop:hover .pick { background: var(--accent-hover); }
  .pick svg { width: 22px; height: 22px; }
  .drop-title { margin-top: 30px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .drop-hint { margin-top: 26px; color: var(--muted); font-size: 15px; }

  .opts { position: relative; z-index: 1; display: flex; justify-content: center; gap: 10px; align-items: center;
    margin: 18px auto 0; color: var(--muted); font-size: 14px; }
  .opts[hidden] { display: none; }
  .opts input { width: 70px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }

  .list { position: relative; z-index: 1; display: grid; gap: 16px; max-width: 720px; margin: 32px auto 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { font-size: 13px; color: var(--muted); }
  .detail.ok { color: var(--ok); } .detail.warn { color: var(--warn); } .detail.err { color: var(--err); }
  .bar { height: 3px; background: var(--border); }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .btn { flex: none; border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 14px;
    background: var(--accent); color: #fff; text-decoration: none; }
  .btn:hover { background: var(--accent-hover); }
  .btn[hidden], .btn-ghost[hidden] { display: none; }
  .actions { display: flex; gap: 8px; flex: none; }
  .btn-ghost { flex: none; border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font: inherit;
    font-weight: 600; font-size: 14px; background: transparent; color: var(--text); cursor: pointer; }
  .btn-ghost:hover { border-color: var(--err); color: var(--err); }
  .btn-ghost:disabled { opacity: .5; cursor: default; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 14px 10px 18px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--border);
    font-size: 14px; color: var(--muted); }
  .toolbar[hidden] { display: none; }
  .detail.muted { color: var(--muted); }
  .stage { display: flex; justify-content: center; background: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%) 0 0/16px 16px; }
  .compare { position: relative; user-select: none; max-width: 100%; }
  .compare img { display: block; max-width: 100%; max-height: 75vh; width: auto; height: auto; }
  .compare .after { position: absolute; inset: 0; width: 100%; height: 100%; clip-path: inset(0 0 0 50%); }
  .compare .line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); pointer-events: none; }
  .compare input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .tag { position: absolute; top: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; background: rgba(0,0,0,.6); color: #fff; }
  .tag.l { left: 8px; } .tag.r { right: 8px; }
  video { display: block; width: 100%; background: #000; }

  @media (max-width: 1100px) { .deco { display: none; } }
  @media (max-width: 600px) {
    main { padding-top: 36px; }
    .sub { font-size: 16px; }
    .drop { min-height: 320px; border-radius: 20px; }
    .pick { padding: 16px 32px; font-size: 18px; }
  }
</style>
</head>
<body>
<main>
  <div class="deco left" aria-hidden="true"><img src="/assets/deco-left.webp" alt=""></div>
  <div class="deco right" aria-hidden="true"><img src="/assets/deco-right.webp" alt=""></div>

  <section class="hero">
    <h1 id="title">Xóa watermark ảnh Gemini</h1>
    <p class="sub" id="subtitle"></p>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-mode="image" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-4.5-4.5L6 21"/></svg>
        Images
      </button>
      <button class="tab" role="tab" data-mode="video" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m10 11 4 2.5-4 2.5z"/></svg>
        Videos <span class="beta">BETA</span>
      </button>
    </div>
  </section>

  <label class="drop" id="drop">
    <span class="pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="pickLabel">Chọn ảnh</span>
    </span>
    <span class="drop-title" id="dropTitle">Thả ảnh Gemini</span>
    <span class="drop-hint" id="dropHint"></span>
    <input type="file" id="file" multiple hidden>
  </label>

  <div class="opts" id="opts" hidden>
    <label>Bitrate video (Mbps): <input type="number" id="bitrate" min="1" max="80" placeholder="12"></label>
  </div>

  <div class="list">
    <div class="toolbar" id="toolbar" hidden>
      <span id="activeCount"></span>
      <div class="actions">
        <button class="btn-ghost" id="cancelAll" type="button" hidden>Hủy tất cả</button>
        <a class="btn" id="downloadAll" hidden>Tải tất cả</a>
      </div>
    </div>
    <div class="list" id="list" style="margin:0"></div>
  </div>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const list = $('#list');
const drop = $('#drop');
const fileInput = $('#file');

const MODES = {
  image: {
    title: 'Xóa watermark ảnh Gemini',
    subtitle: 'Xóa watermark ảnh Gemini ngay trên máy của bạn. Tệp của bạn luôn nằm trên thiết bị.',
    pick: 'Chọn ảnh',
    dropTitle: 'Thả ảnh Gemini',
    hint: 'PNG, JPG hoặc WEBP. Có thể chọn nhiều ảnh cùng lúc.',
    accept: 'image/png,image/jpeg,image/webp',
    pattern: /\.(png|jpe?g|webp)$/i
  },
  video: {
    title: 'Xóa watermark video Gemini',
    subtitle: 'Xóa watermark video Gemini ngay trên máy của bạn. Tệp của bạn luôn nằm trên thiết bị.',
    pick: 'Chọn video',
    dropTitle: 'Thả video Gemini',
    hint: 'MP4, WebM hoặc MOV. Nên thử trước với clip 1080p ngắn dưới 100 MB.',
    accept: 'video/mp4,video/webm,video/quicktime',
    pattern: /\.(mp4|webm|mov)$/i
  }
};
let mode = 'image';

function setMode(next) {
  mode = next;
  const m = MODES[mode];
  $('#title').textContent = m.title;
  $('#subtitle').textContent = m.subtitle;
  $('#pickLabel').textContent = m.pick;
  $('#dropTitle').textContent = m.dropTitle;
  $('#dropHint').textContent = m.hint;
  fileInput.accept = m.accept;
  $('#opts').hidden = mode !== 'video';
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.mode === mode)));
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setMode(t.dataset.mode)));
setMode('image');

drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });

function handleFiles(files) {
  for (const file of files) {
    // Thả nhầm loại file thì tự chuyển tab cho khớp.
    if (!MODES[mode].pattern.test(file.name)) {
      const other = mode === 'image' ? 'video' : 'image';
      if (MODES[other].pattern.test(file.name)) setMode(other);
    }
    upload(file);
  }
}

function makeCard(file) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="head">
      <div style="min-width:0">
        <div class="name"></div>
        <div class="detail">Đang tải lên…</div>
      </div>
      <div class="actions">
        <button class="btn-ghost cancel" type="button" hidden>Hủy</button>
        <a class="btn" hidden>Tải về</a>
      </div>
    </div>
    <div class="bar"><i></i></div>
    <div class="body"></div>`;
  $('.name', card).textContent = file.name;
  list.prepend(card);
  return card;
}

// id → card của các video đang chờ / đang export
const activeJobs = new Map();
const isActive = (job) => job.status === 'queued' || job.status === 'processing';

// id của các file đã xử lý xong, theo thứ tự hoàn thành
const doneJobs = new Set();

function refreshToolbar() {
  const active = activeJobs.size;
  const done = doneJobs.size;
  $('#toolbar').hidden = active === 0 && done === 0;
  $('#activeCount').textContent = [
    active ? `Đang xử lý ${active} video` : '',
    done ? `${done} file đã xong` : ''
  ].filter(Boolean).join(' · ');
  $('#cancelAll').hidden = active === 0;
  if (active === 0) $('#cancelAll').disabled = false;
  const dl = $('#downloadAll');
  dl.hidden = done === 0;
  dl.textContent = done > 1 ? `Tải tất cả (${done})` : 'Tải về';
  dl.href = done === 1
    ? `/api/result/${[...doneJobs][0]}?download`
    : `/api/download-all?ids=${[...doneJobs].join(',')}`;
}

$('#cancelAll').addEventListener('click', async () => {
  $('#cancelAll').disabled = true;
  activeJobs.forEach((card) => { $('.cancel', card).disabled = true; });
  await fetch('/api/cancel-all', { method: 'POST' }).catch(() => {});
});

function setStatus(card, job) {
  const detail = $('.detail', card);
  detail.textContent = job.detail || job.error || '';
  detail.className = 'detail' + (job.status === 'error' || job.error ? ' err'
    : job.status === 'cancelled' ? ' muted'
    : job.status === 'done' ? (job.applied === false ? ' warn' : ' ok') : '');
  if (job.id) {
    if (isActive(job)) activeJobs.set(job.id, card); else activeJobs.delete(job.id);
    if (job.status === 'done') doneJobs.add(job.id);
    refreshToolbar();
  }
  const cancel = $('.cancel', card);
  cancel.hidden = !isActive(job);
  if (cancel.hidden) cancel.disabled = false;
  if (job.id && !cancel.onclick) {
    cancel.onclick = async () => {
      cancel.disabled = true;
      cancel.textContent = 'Đang hủy…';
      await fetch(`/api/cancel/${job.id}`, { method: 'POST' }).catch(() => {});
    };
  }
  if (job.elapsedMs) detail.textContent += ` · ${(job.elapsedMs / 1000).toFixed(1)}s`;
  $('.bar > i', card).style.width = `${Math.round((job.progress || 0) * 100)}%`;
}

async function upload(file) {
  const card = makeCard(file);
  const bitrate = $('#bitrate').value;
  try {
    const params = new URLSearchParams({ name: file.name });
    if (bitrate) params.set('bitrate', bitrate);
    const res = await fetch(`/api/process?${params}`, { method: 'POST', body: file });
    let job = await res.json();
    if (!res.ok) throw new Error(job.error || res.statusText);
    setStatus(card, job);
    while (isActive(job)) {
      await new Promise((r) => setTimeout(r, 1000));
      job = await (await fetch(`/api/job/${job.id}`)).json();
      setStatus(card, job);
    }
    if (job.status === 'done') showResult(card, job);
  } catch (error) {
    setStatus(card, { error: error.message, status: 'error' });
  }
}

function showResult(card, job) {
  const btn = $('.btn', card);
  btn.href = `/api/result/${job.id}?download`;
  btn.hidden = false;
  const body = $('.body', card);
  const v = Date.now();
  if (job.kind === 'video') {
    body.innerHTML = `<video controls src="/api/result/${job.id}?v=${v}"></video>`;
    return;
  }
  body.innerHTML = `
    <div class="stage"><div class="compare">
      <img src="/api/original/${job.id}" alt="Gốc">
      <img class="after" src="/api/result/${job.id}?v=${v}" alt="Đã xóa">
      <div class="line"></div>
      <span class="tag l">Gốc</span><span class="tag r">Đã xóa</span>
      <input type="range" min="0" max="100" value="50" aria-label="So sánh trước/sau">
    </div></div>`;
  const range = $('input', body);
  range.addEventListener('input', () => {
    $('.after', body).style.clipPath = `inset(0 0 0 ${range.value}%)`;
    $('.line', body).style.left = `${range.value}%`;
  });
}
</script>
</body>
</html>
